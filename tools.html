<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tools — ViralCut</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e1f22'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' fill='%235865f2' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#1e1f22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#1e1f22; --panel:#2b2d31; --panel-2:#313338;
    --ember:#5865f2; --ember-glow:#7983f5; --steel:#6f80d1;
    --paper:#f2f3f5; --iron:#949ba4;
    --line:rgba(242,243,245,0.12); --line-strong:rgba(242,243,245,0.22);
    --font-display:'Oswald',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--void);color:var(--paper);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  h1,h2,h3{font-family:var(--font-display);text-transform:uppercase;font-weight:700;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 32px;}
  header{border-bottom:1px solid var(--line);padding:22px 0;}
  .nav{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-family:var(--font-display);font-weight:700;font-size:19px;text-transform:uppercase;}
  .logo .dot{color:var(--ember);}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:3px;font-weight:600;font-size:13.5px;border:1px solid var(--line-strong);background:transparent;color:var(--paper);cursor:pointer;font-family:var(--font-body);}
  .btn:hover{border-color:var(--paper);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-primary{background:var(--ember);border-color:var(--ember);color:#ffffff;}

  main{padding:56px 0 100px;}
  .state{display:none;}
  .state.on{display:block;}

  .greeting{font-size:clamp(28px,4vw,40px);margin-bottom:6px;}
  .sub{color:var(--iron);margin-bottom:36px;}

  .plan-banner{background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:16px 20px;margin-bottom:28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .plan-banner.free{border-color:rgba(88,101,242,0.35);}
  .plan-banner-text{color:var(--iron);font-size:13.5px;}
  .plan-banner-text strong{color:var(--paper);}

  .tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:8px;}
  @media(max-width:820px){.tool-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.tool-grid{grid-template-columns:1fr;}}

  .tool-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color 0.15s;text-align:left;}
  .tool-card:hover{border-color:var(--line-strong);}
  .tool-card.active{border-color:var(--ember);}
  .tool-card.soon{cursor:default;opacity:0.6;}
  .tool-card.soon:hover{border-color:var(--line);}
  .tool-preview{height:100px;display:flex;align-items:center;justify-content:center;position:relative;font-size:34px;}
  .tool-card-body{padding:14px 16px 16px;}
  .tool-card-title{font-family:var(--font-display);font-size:14px;letter-spacing:0.02em;margin-bottom:4px;}
  .tool-card-desc{color:var(--iron);font-size:12px;line-height:1.4;}
  .soon-tag{position:absolute;top:8px;right:8px;background:var(--void);border:1px solid var(--line-strong);color:var(--iron);font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.05em;padding:3px 8px;border-radius:12px;}

  .preview-images{background:linear-gradient(135deg,#3a2418,#2b2d31);}
  .preview-voice{background:linear-gradient(135deg,#1c2a33,#2b2d31);}
  .preview-download{background:linear-gradient(135deg,#241b33,#2b2d31);}
  .preview-bg{background:repeating-conic-gradient(#2a2420 0% 25%,#211c18 0% 50%) 50%/16px 16px;}
  .preview-ideas{background:linear-gradient(135deg,#20301f,#2b2d31);}
  .preview-enhance{background:linear-gradient(135deg,#332118,#2b2d31);}
  .preview-vocal{background:linear-gradient(135deg,#33182a,#2b2d31);}
  .preview-video{background:linear-gradient(135deg,#181e33,#2b2d31);}

  .tool-panel{display:none;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:26px;margin-top:24px;}
  .tool-panel.on{display:block;}
  .tool-panel h3{font-size:16px;margin-bottom:16px;}
  .tool-panel label{display:block;font-size:12.5px;color:var(--iron);margin-bottom:6px;}
  .tool-panel input[type="text"], .tool-panel textarea, .tool-panel select{
    width:100%;background:var(--void);border:1px solid var(--line-strong);color:var(--paper);
    padding:11px 14px;border-radius:4px;font-size:13.5px;font-family:var(--font-body);box-sizing:border-box;margin-bottom:14px;
  }
  .tool-panel textarea{min-height:90px;resize:vertical;}
  .tool-panel input[type="file"]{margin-bottom:14px;font-size:13px;color:var(--iron);}
  .tool-status{font-size:13px;color:var(--iron);margin-top:12px;display:none;}
  .tool-status.on{display:block;}
  .tool-error{font-size:13px;color:#ff8a8a;margin-top:12px;display:none;}
  .tool-error.on{display:block;}
  .tool-result{margin-top:18px;display:none;}
  .tool-result.on{display:block;}
  .tool-result img{max-width:100%;border-radius:6px;border:1px solid var(--line);}
  .tool-result audio{width:100%;margin-bottom:10px;}
  .idea-list{list-style:none;}
  .idea-list li{padding:10px 14px;background:var(--void);border:1px solid var(--line);border-radius:5px;margin-bottom:8px;font-size:13.5px;}
  .paywall-inline{background:var(--void);border:1px solid rgba(88,101,242,0.35);border-radius:6px;padding:14px 16px;font-size:13.5px;color:var(--iron);margin-top:16px;}
  .paywall-inline a{color:var(--ember-glow);font-weight:600;}
  .close-panel{float:right;background:none;border:none;color:var(--iron);cursor:pointer;font-size:13px;}

  .loading, .error-state{text-align:center;padding:80px 0;color:var(--iron);}
  .error-state a{color:var(--ember-glow);}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="logo">VIRAL<span class="dot">•</span>CUT</a>
    <div style="display:flex;gap:10px;">
      <a href="dashboard.html" class="btn">Dashboard</a>
      <button class="btn" id="signOutBtn">Sign out</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="state" id="loadingState"><div class="loading">Loading…</div></div>

  <div class="state" id="errorState">
    <div class="error-state">
      Sign in to use the AI tools.<br><br>
      <a href="index.html">← Back to ViralCut to sign in</a>
    </div>
  </div>

  <div class="state" id="readyState">
    <h1 class="greeting">AI Tools</h1>
    <p class="sub">Standalone tools, separate from the clip editor — generate an image, clean up audio, or brainstorm ideas without starting a full clip job.</p>

    <div class="plan-banner" id="planBanner">
      <div class="plan-banner-text" id="planBannerText"></div>
      <a href="index.html#pricing" class="btn btn-primary" id="upgradeBtn" style="display:none;">Upgrade plan</a>
    </div>

    <div class="tool-grid" id="toolGrid"></div>

    <div class="tool-panel" id="toolPanel">
      <button class="close-panel" id="closePanelBtn">✕ close</button>
      <h3 id="panelTitle"></h3>
      <div id="panelBody"></div>
      <div class="tool-status" id="panelStatus"></div>
      <div class="tool-error" id="panelError"></div>
      <div class="tool-result" id="panelResult"></div>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script>
  const BACKEND_URL = window.CLIPSMITH_BACKEND_URL;
  const PIPELINE_URL = window.CLIPSMITH_AI_PIPELINE_URL;

  const states = ['loadingState','errorState','readyState'];
  function showState(id){ states.forEach(s => document.getElementById(s).classList.toggle('on', s===id)); }

  function getToken(){ return localStorage.getItem('clipsmith_token'); }
  function clearToken(){ localStorage.removeItem('clipsmith_token'); }

  let currentUser = null;

  // Every tool on this page runs on either a shared free-tier third-party
  // quota (Gemini/Groq — one abusive user could burn the whole site's
  // daily allowance) or real self-hosted CPU work (Demucs/DeepFilterNet
  // are genuinely expensive per call) — so unlike upload-based clipping,
  // there's no safe free tier here. Paid plans only, checked before any
  // tool actually runs.
  function requirePaidPlan(){
    if(!currentUser){
      window.location.href = 'index.html';
      return false;
    }
    if(currentUser.plan === 'free'){
      document.getElementById('panelError').textContent = '';
      const err = document.getElementById('panelError');
      err.innerHTML = "This tool requires a paid plan — <a href=\"index.html#pricing\" style=\"color:var(--ember-glow);font-weight:600;\">upgrade here</a>.";
      err.classList.add('on');
      return false;
    }
    return true;
  }

  const TOOLS = [
    { id:'images', title:'AI Images', desc:'Generate an image from a text prompt.', icon:'🖼️', preview:'preview-images', ready:true },
    { id:'voice', title:'AI Voiceovers', desc:'Turn a script into natural speech.', icon:'🎙️', preview:'preview-voice', ready:true },
    { id:'download', title:'Download Social Videos', desc:'Save a YouTube or TikTok video directly.', icon:'⬇️', preview:'preview-download', ready:true },
    { id:'bgremove', title:'Background Remover', desc:'Strip the background from an image.', icon:'✂️', preview:'preview-bg', ready:true },
    { id:'ideas', title:'Brainstorm Ideas', desc:'Get short-form content ideas on any topic.', icon:'💡', preview:'preview-ideas', ready:true },
    { id:'enhance', title:'Speech Enhancer', desc:'Clean up noisy voice recordings.', icon:'🔊', preview:'preview-enhance', ready:true },
    { id:'vocal', title:'Vocal Remover', desc:'Split a track into vocals + instrumental.', icon:'🎵', preview:'preview-vocal', ready:true },
    { id:'video', title:'AI Videos', desc:'Talking AI avatar videos.', icon:'🎬', preview:'preview-video', ready:true },
  ];

  function renderGrid(){
    const grid = document.getElementById('toolGrid');
    grid.innerHTML = '';
    TOOLS.forEach(t=>{
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'tool-card' + (t.ready ? '' : ' soon');
      card.innerHTML = `
        <div class="tool-preview ${t.preview}">
          ${t.icon}
          ${!t.ready ? '<span class="soon-tag">Coming soon</span>' : ''}
        </div>
        <div class="tool-card-body">
          <div class="tool-card-title">${t.title}</div>
          <div class="tool-card-desc">${t.desc}</div>
        </div>`;
      if(t.ready){
        card.addEventListener('click', ()=> openTool(t.id));
      }
      grid.appendChild(card);
    });
  }

  const panel = document.getElementById('toolPanel');
  const panelTitle = document.getElementById('panelTitle');
  const panelBody = document.getElementById('panelBody');
  const panelStatus = document.getElementById('panelStatus');
  const panelError = document.getElementById('panelError');
  const panelResult = document.getElementById('panelResult');

  function resetPanel(){
    panelStatus.classList.remove('on'); panelStatus.textContent = '';
    panelError.classList.remove('on'); panelError.textContent = '';
    panelResult.classList.remove('on'); panelResult.innerHTML = '';
  }

  const VOICE_OPTIONS = ['Rachel','Adam','Bella','Antoni','Elli','Josh'];

  const PANEL_BUILDERS = {
    download: () => `
      <label>Video link</label>
      <input type="text" id="downloadUrl" placeholder="https://www.youtube.com/watch?v=… or a TikTok link">
      <button class="btn btn-primary" id="downloadGoBtn">Download video</button>`,
    images: () => `
      <label>Prompt</label>
      <input type="text" id="imagesPrompt" placeholder="A small, adorable cat with bright green eyes…">
      <button class="btn btn-primary" id="imagesGoBtn">Generate image</button>
      <div style="font-size:12px;color:var(--iron);margin-top:10px;" id="imagesQuotaNote"></div>`,
    voice: () => `
      <label>Script</label>
      <textarea id="voiceScript" placeholder="Type what you want it to say…"></textarea>
      <label>Voice</label>
      <select id="voiceSelect">${VOICE_OPTIONS.map(v=>`<option value="${v}">${v}</option>`).join('')}</select>
      <button class="btn btn-primary" id="voiceGoBtn">Generate voiceover</button>`,
    bgremove: () => `
      <label>Image</label>
      <input type="file" id="bgFile" accept="image/*">
      <button class="btn btn-primary" id="bgGoBtn">Remove background</button>`,
    ideas: () => `
      <label>Topic</label>
      <input type="text" id="ideasTopic" placeholder="e.g. personal finance, gaming, cooking">
      <label>Idea type</label>
      <select id="ideasType">
        <option>Story Video</option>
        <option>Split Screen Video</option>
        <option>Talking Head Video</option>
      </select>
      <button class="btn btn-primary" id="ideasGoBtn">Generate ideas</button>`,
    enhance: () => `
      <label>Audio file</label>
      <input type="file" id="enhanceFile" accept="audio/*">
      <button class="btn btn-primary" id="enhanceGoBtn">Enhance speech</button>`,
    vocal: () => `
      <label>Audio or video file</label>
      <input type="file" id="vocalFile" accept="audio/*,video/*">
      <button class="btn btn-primary" id="vocalGoBtn">Separate vocals</button>`,
    video: () => `
      <label>Photo (the face that will talk)</label>
      <input type="file" id="videoPhoto" accept="image/png,image/jpeg">
      <label>Script</label>
      <textarea id="videoScript" placeholder="Type what the avatar should say…"></textarea>
      <button class="btn btn-primary" id="videoGoBtn">Generate video</button>
      <div style="font-size:12px;color:var(--iron);margin-top:10px;">Rendering can take a minute or two. This runs on a small free quota (~5 min of video/month total) — it may stop working if that's used up until it resets.</div>`,
  };

  function openTool(id){
    const tool = TOOLS.find(t=>t.id===id);
    document.querySelectorAll('.tool-card').forEach(c=>c.classList.remove('active'));
    resetPanel();
    panelTitle.textContent = tool.title;
    panelBody.innerHTML = PANEL_BUILDERS[id]();
    panel.classList.add('on');
    panel.scrollIntoView({ behavior:'smooth', block:'start' });
    wireToolActions(id);
    if(id === 'images') refreshImagesQuotaNote();
  }

  // AI Images is metered separately from everything else on this page —
  // Gemini's free tier (~500 req/day) is shared across the WHOLE site, so
  // each plan gets a small daily allowance (see PLAN_IMAGE_DAILY_LIMITS in
  // server.js) instead of unlimited use. This just reflects the numbers
  // server.js already tracks; the real enforcement happens server-side in
  // /api/consume-image-generation, called after each successful generation.
  function refreshImagesQuotaNote(){
    const note = document.getElementById('imagesQuotaNote');
    if(!note || !currentUser) return;
    const cap = currentUser.imagesDailyCap;
    const used = currentUser.imagesUsedToday || 0;
    note.textContent = cap ? `${Math.max(0, cap - used)} of ${cap} images left today (resets daily).` : '';
  }

  document.getElementById('closePanelBtn').addEventListener('click', ()=>{
    panel.classList.remove('on');
  });

  async function callTool(url, formData, onSuccess, statusMessage){
    resetPanel();
    if(!requirePaidPlan()) return;
    panelStatus.textContent = statusMessage || 'Working…';
    panelStatus.classList.add('on');
    try{
      const res = await fetch(`${PIPELINE_URL}${url}`, {
        method:'POST', body: formData, signal: AbortSignal.timeout(300000),
      });
      if(!res.ok){
        const err = await res.json().catch(()=>({detail:'Unknown error'}));
        throw new Error(err.detail || 'Request failed');
      }
      const data = await res.json();
      onSuccess(data);
    }catch(err){
      panelError.textContent = err.message || 'Something went wrong.';
      panelError.classList.add('on');
    }finally{
      panelStatus.classList.remove('on');
    }
  }

  function wireToolActions(id){
    if(id === 'download'){
      document.getElementById('downloadGoBtn').addEventListener('click', ()=>{
        const url = document.getElementById('downloadUrl').value.trim();
        if(!url) return;
        const fd = new FormData(); fd.append('url', url);
        callTool('/download-social-video', fd, (data)=>{
          const mb = data.size_bytes ? (data.size_bytes / (1024*1024)).toFixed(1) + ' MB' : '';
          panelResult.innerHTML = `
            <video controls style="width:100%;border-radius:6px;border:1px solid var(--line);margin-bottom:10px;" src="${PIPELINE_URL}${data.url}"></video>
            <a class="btn btn-primary" href="${PIPELINE_URL}${data.url}" download>Download ${mb}</a>`;
          panelResult.classList.add('on');
        });
      });
    }
    if(id === 'images'){
      document.getElementById('imagesGoBtn').addEventListener('click', async ()=>{
        const prompt = document.getElementById('imagesPrompt').value.trim();
        if(!prompt) return;
        resetPanel();
        if(!requirePaidPlan()) return;
        // Client-side pre-check against the last numbers we fetched —
        // saves a wasted Gemini call when obviously over the daily cap.
        // /api/consume-image-generation below is still the real
        // enforcement, checked fresh against the live count.
        if(currentUser.imagesDailyCap && (currentUser.imagesUsedToday || 0) >= currentUser.imagesDailyCap){
          panelError.textContent = `You've used all ${currentUser.imagesDailyCap} AI Images generations today — resets tomorrow.`;
          panelError.classList.add('on');
          return;
        }
        const fd = new FormData(); fd.append('prompt', prompt);
        await callTool('/generate-image', fd, async (data)=>{
          panelResult.innerHTML = `<img src="${PIPELINE_URL}${data.url}">`;
          panelResult.classList.add('on');
          // Record usage against the daily cap now that generation actually
          // succeeded (no point charging a failed request against it).
          try{
            const res = await fetch(`${BACKEND_URL}/api/consume-image-generation`, {
              method:'POST', headers:{ 'Authorization': `Bearer ${getToken()}` },
            });
            if(res.ok) currentUser = await res.json();
          }catch(err){ /* usage tracking is best-effort — don't block on it */ }
          refreshImagesQuotaNote();
        });
      });
    }
    if(id === 'voice'){
      document.getElementById('voiceGoBtn').addEventListener('click', ()=>{
        const script = document.getElementById('voiceScript').value.trim();
        const voice = document.getElementById('voiceSelect').value;
        if(!script) return;
        const fd = new FormData(); fd.append('script', script); fd.append('voice', voice);
        callTool('/synthesize-voice', fd, (data)=>{
          panelResult.innerHTML = `<audio controls src="${PIPELINE_URL}${data.url}"></audio>`;
          panelResult.classList.add('on');
        });
      });
    }
    if(id === 'bgremove'){
      document.getElementById('bgGoBtn').addEventListener('click', ()=>{
        const f = document.getElementById('bgFile').files[0];
        if(!f) return;
        const fd = new FormData(); fd.append('file', f);
        callTool('/remove-background', fd, (data)=>{
          panelResult.innerHTML = `<img src="${PIPELINE_URL}${data.url}" style="background:repeating-conic-gradient(#2a2420 0% 25%,#211c18 0% 50%) 50%/16px 16px;">`;
          panelResult.classList.add('on');
        });
      });
    }
    if(id === 'ideas'){
      document.getElementById('ideasGoBtn').addEventListener('click', ()=>{
        const topic = document.getElementById('ideasTopic').value.trim();
        const ideaType = document.getElementById('ideasType').value;
        if(!topic) return;
        const fd = new FormData(); fd.append('topic', topic); fd.append('idea_type', ideaType);
        callTool('/brainstorm-ideas', fd, (data)=>{
          panelResult.innerHTML = `<ul class="idea-list">${data.ideas.map(i=>`<li>${i}</li>`).join('')}</ul>`;
          panelResult.classList.add('on');
        });
      });
    }
    if(id === 'enhance'){
      document.getElementById('enhanceGoBtn').addEventListener('click', ()=>{
        const f = document.getElementById('enhanceFile').files[0];
        if(!f) return;
        const fd = new FormData(); fd.append('file', f);
        callTool('/enhance-speech', fd, (data)=>{
          panelResult.innerHTML = `<audio controls src="${PIPELINE_URL}${data.url}"></audio>`;
          panelResult.classList.add('on');
        });
      });
    }
    if(id === 'vocal'){
      document.getElementById('vocalGoBtn').addEventListener('click', ()=>{
        const f = document.getElementById('vocalFile').files[0];
        if(!f) return;
        const fd = new FormData(); fd.append('file', f);
        callTool('/remove-vocals', fd, (data)=>{
          panelResult.innerHTML = `
            <div style="margin-bottom:14px;">
              <label style="display:block;font-size:12.5px;color:var(--iron);margin-bottom:6px;">Vocals</label>
              <audio controls src="${PIPELINE_URL}${data.vocals_url}"></audio>
            </div>
            <div>
              <label style="display:block;font-size:12.5px;color:var(--iron);margin-bottom:6px;">Instrumental</label>
              <audio controls src="${PIPELINE_URL}${data.instrumental_url}"></audio>
            </div>`;
          panelResult.classList.add('on');
        });
      });
    }
    if(id === 'video'){
      document.getElementById('videoGoBtn').addEventListener('click', ()=>{
        const photo = document.getElementById('videoPhoto').files[0];
        const script = document.getElementById('videoScript').value.trim();
        if(!photo || !script) return;
        const fd = new FormData(); fd.append('image', photo); fd.append('script', script);
        callTool('/generate-avatar-video', fd, (data)=>{
          panelResult.innerHTML = `<video controls style="width:100%;border-radius:6px;border:1px solid var(--line);" src="${data.video_url}"></video>`;
          panelResult.classList.add('on');
        }, 'Rendering — this can take a minute or two…');
      });
    }
  }

  async function loadAccount(){
    showState('loadingState');
    const token = getToken();
    if(!token){ showState('errorState'); return; }
    try{
      const res = await fetch(`${BACKEND_URL}/api/me`, { headers: { 'Authorization': `Bearer ${token}` } });
      if(!res.ok){ clearToken(); showState('errorState'); return; }
      currentUser = await res.json();

      const banner = document.getElementById('planBanner');
      const bannerText = document.getElementById('planBannerText');
      const upgradeBtn = document.getElementById('upgradeBtn');
      if(currentUser.plan === 'free'){
        banner.classList.add('free');
        bannerText.innerHTML = `<strong>Free plan</strong> — these tools require a paid plan (they run on shared free-tier quotas or real server compute).`;
        upgradeBtn.style.display = '';
      } else {
        bannerText.innerHTML = `<strong>${currentUser.plan[0].toUpperCase()+currentUser.plan.slice(1)} plan</strong> — all tools unlocked.`;
        upgradeBtn.style.display = 'none';
      }

      renderGrid();
      showState('readyState');
    }catch(err){
      showState('errorState');
    }
  }

  document.getElementById('signOutBtn').addEventListener('click', async ()=>{
    const token = getToken();
    try{
      if(token) await fetch(`${BACKEND_URL}/api/logout`, { method:'POST', headers: { 'Authorization': `Bearer ${token}` } });
    }catch(err){ /* ignore */ }
    clearToken();
    window.location.href = 'index.html';
  });

  loadAccount();
</script>
