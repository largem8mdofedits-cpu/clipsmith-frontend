<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Send a campaign — admin</title>
<style>
  :root{color-scheme:dark;}
  body{background:#0b0b0d;color:#e8e8e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:640px;margin:40px auto;padding:0 20px;}
  h1{font-size:20px;margin-bottom:4px;}
  p.sub{color:#999;font-size:13px;margin-top:0;margin-bottom:28px;}
  label{display:block;font-size:13px;font-weight:600;color:#aaa;margin-bottom:6px;margin-top:18px;}
  input[type=text],input[type=password],textarea{width:100%;box-sizing:border-box;padding:10px 12px;background:#1a1a1e;border:1px solid #333;border-radius:6px;color:#fff;font-size:14px;font-family:inherit;}
  textarea{min-height:220px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5;}
  .hint{font-size:12px;color:#777;margin-top:6px;}
  .audience{margin-top:18px;padding:12px 14px;background:#151518;border:1px solid #262629;border-radius:8px;font-size:13px;color:#ccc;}
  .audience b{color:#7c7cff;}
  button{margin-top:22px;width:100%;padding:12px;border:0;border-radius:6px;background:#6c6cff;color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
  button:disabled{background:#333;color:#777;cursor:not-allowed;}
  .status{margin-top:14px;font-size:13px;white-space:pre-wrap;}
  .status.ok{color:#5fd97f;}
  .status.err{color:#ff6b6b;}
  .preview-toggle{margin-top:10px;font-size:12.5px;color:#7c7cff;cursor:pointer;background:none;border:0;padding:0;font-weight:600;width:auto;display:inline-block;}
  .preview-box{display:none;margin-top:10px;border:1px solid #262629;border-radius:8px;overflow:hidden;}
  .preview-box iframe{width:100%;height:320px;border:0;background:#fff;}
</style>
</head>
<body>
  <h1>Send a campaign</h1>
  <p class="sub">Goes to everyone who opted into marketing emails AND verified their address. An unsubscribe link is appended automatically — can't be turned off.</p>

  <label for="adminKey">Admin key</label>
  <input type="password" id="adminKey" placeholder="Your ADMIN_KEY" autocomplete="off">

  <div class="audience" id="audienceBox">Enter your admin key to see audience size.</div>

  <label for="subject">Subject</label>
  <input type="text" id="subject" placeholder="e.g. New: gameplay backgrounds + top captions">

  <label for="body">Email body (HTML)</label>
  <textarea id="body" placeholder="&lt;h2&gt;Hey there 👋&lt;/h2&gt;&lt;p&gt;We just shipped...&lt;/p&gt;"></textarea>
  <div class="hint">Basic HTML only (h1-h3, p, a, b, ul/li). Keep it short — this isn't a full template builder.</div>
  <button type="button" class="preview-toggle" id="previewToggleBtn">Show preview</button>
  <div class="preview-box" id="previewBox"><iframe id="previewFrame"></iframe></div>

  <button id="sendBtn" disabled>Send campaign</button>
  <div class="status" id="status"></div>

<script src="config.js"></script>
<script>
  const API = window.CLIPSMITH_BACKEND_URL || window.CLIPSMITH_AI_PIPELINE_URL;
  const adminKeyEl = document.getElementById('adminKey');
  const subjectEl = document.getElementById('subject');
  const bodyEl = document.getElementById('body');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');
  const audienceBox = document.getElementById('audienceBox');
  const previewToggleBtn = document.getElementById('previewToggleBtn');
  const previewBox = document.getElementById('previewBox');
  const previewFrame = document.getElementById('previewFrame');
  let audienceCount = null;

  function setStatus(msg, kind){
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function updateSendEnabled(){
    sendBtn.disabled = !(adminKeyEl.value.trim() && subjectEl.value.trim() && bodyEl.value.trim() && audienceCount);
  }
  [subjectEl, bodyEl].forEach(el => el.addEventListener('input', updateSendEnabled));

  previewToggleBtn.addEventListener('click', () => {
    const showing = previewBox.style.display === 'block';
    previewBox.style.display = showing ? 'none' : 'block';
    previewToggleBtn.textContent = showing ? 'Show preview' : 'Hide preview';
    if(!showing) previewFrame.srcdoc = bodyEl.value || '<p style="font-family:sans-serif;color:#888;">Nothing to preview yet.</p>';
  });

  let audienceTimer = null;
  adminKeyEl.addEventListener('input', () => {
    clearTimeout(audienceTimer);
    audienceTimer = setTimeout(loadAudience, 400);
  });

  async function loadAudience(){
    const key = adminKeyEl.value.trim();
    if(!key){ audienceBox.textContent = 'Enter your admin key to see audience size.'; audienceCount = null; updateSendEnabled(); return; }
    audienceBox.textContent = 'Checking audience…';
    try{
      const res = await fetch(`${API}/api/admin/campaign-audience-count?key=${encodeURIComponent(key)}`);
      if(!res.ok){
        const err = await res.json().catch(() => ({error:'Not authorized'}));
        audienceBox.textContent = err.error || 'Could not check audience.';
        audienceCount = null;
        updateSendEnabled();
        return;
      }
      const data = await res.json();
      audienceCount = data.audience;
      audienceBox.innerHTML = `Will send to <b>${data.audience}</b> verified, opted-in ${data.audience === 1 ? 'user' : 'users'}.`;
    }catch(err){
      audienceBox.textContent = 'Could not reach the server: ' + err.message;
      audienceCount = null;
    }
    updateSendEnabled();
  }

  sendBtn.addEventListener('click', async () => {
    const key = adminKeyEl.value.trim();
    const subject = subjectEl.value.trim();
    const html = bodyEl.value.trim();
    if(!key || !subject || !html) return;
    if(!confirm(`Send this to ${audienceCount} ${audienceCount === 1 ? 'person' : 'people'}? This can't be undone.`)) return;

    sendBtn.disabled = true;
    setStatus('Sending… this can take a bit for a larger list.');
    try{
      const res = await fetch(`${API}/api/admin/send-campaign`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
        body: JSON.stringify({ subject, html }),
      });
      const data = await res.json();
      if(!res.ok){
        throw new Error(data.error || 'Send failed');
      }
      if(data.skipped){
        setStatus('RESEND_API_KEY isn\'t set on the backend yet — nothing was actually sent. Set it in Railway, then try again.', 'err');
      }else{
        setStatus(`Sent to ${data.sent} of ${data.audience}${data.failed ? ` (${data.failed} failed — check server logs)` : ''}.`, 'ok');
      }
    }catch(err){
      setStatus('Send failed: ' + err.message, 'err');
    }finally{
      updateSendEnabled();
    }
  });

  updateSendEnabled();
</script>
</body>
</html>
